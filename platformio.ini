; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-p4]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.39
upload_speed = 1500000
monitor_speed = 115200
build_type = debug
framework = arduino
board = esp32-p4-evboard
board_build.mcu = esp32p4
board_build.flash_mode = qio
;board_build.psram_type = qio
board_build.partitions = partitions.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCONFIG_ESP32_PHY_MAX_WIFI_TX_POWER=20
; Tab5 の DSI 表示は PSRAM 200MHz が必要（80MHz だと読み出しが間に合わず画面が化ける）。
; 55.03.39 の esp32-p4-evboard は chip_variant=esp32p4_es / PSRAM 200MHz のビルド済みライブラリを使うため指定不要。
; custom_sdkconfig を指定するとライブラリ再ビルドが走り、SCons のバージョン競合でビルドに失敗する。
;custom_sdkconfig = CONFIG_SPIRAM_SPEED_200M=y

lib_deps  =
    m5stack/M5Unified @ >=0.2.17
    m5stack/M5GFX @ >=0.2.22
    tzapu/WiFiManager @ ^2.0.17
    michalmonday/CSV Parser @ ^1.4.1
    artronshop/ArtronShop_RX8130CE @ ^1.0.0